name: Publish ROSE Market

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 8,20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read project source
        uses: actions/checkout@v7

      - name: Verify code before publishing the archive
        run: |
          npm run check
          npm test

      - name: Restore the last published archive
        run: node scripts/published-data.mjs

      - name: Record the start of this archive check
        run: node --input-type=module -e 'import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `REFRESH_STARTED_AT=${new Date().toISOString()}\n`);'

      # A successful step means the archive was validated and its status saved.
      # Source availability stays false; validation or write failures stop deploy.
      - name: Record the retired market source
        id: sync
        run: node scripts/record-retired-source.mjs market

      - name: Record the retired price history source
        id: history
        run: node scripts/record-retired-source.mjs history

      - name: Validate and report archive status
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: node scripts/report-sync.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm archive publication
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Publikacja

          **Archiwum opublikowane poprawnie. Aktualne dane rynku pozostają niedostępne.**

          [Otwórz ROSE Market](https://abeel87.github.io/rose-market/). Źródło zakończyło aktualizacje 24.10.2026; zachowano oryginalne ceny i daty obserwacji. Udana publikacja nie oznacza pobrania nowych ofert.
          SUMMARY
