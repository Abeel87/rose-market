name: Publish ROSE Market

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/sync-market.mjs'
      - 'scripts/sync-history.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 8,20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read project source
        uses: actions/checkout@v7

      - name: Refresh the market snapshot
        id: sync
        continue-on-error: true
        run: node scripts/sync-market.mjs

      - name: Refresh the separate buy and sell price history
        id: history
        continue-on-error: true
        run: node scripts/sync-history.mjs

      - name: Report refresh status
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          for (const [name, file, outcome] of [
            ['Rynek', 'sync-status.json', process.env.SYNC_OUTCOME],
            ['Historia cen', 'history-status.json', process.env.HISTORY_OUTCOME],
          ]) {
            const status = JSON.parse(readFileSync(`dist/data/${file}`, 'utf8'));
            if (typeof status.success !== 'boolean' || !status.attemptedAt) {
              throw new Error(`Missing or invalid refresh status: ${name}.`);
            }
            if (outcome === 'failure' && status.success) {
              throw new Error(`The refresh failed without an honest failure status: ${name}.`);
            }
            const note = status.success
              ? 'Pobrano i sprawdzono komplet danych. Czas pobrania nie zastępuje dat obserwacji.'
              : 'Odświeżenie nie powiodło się. Publikowana jest zweryfikowana kopia zapasowa, z widocznym statusem błędu.';
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## ${name}\n\n${note}\n\nPróba: ${status.attemptedAt}\n\nData kopii danych: ${status.snapshotFetchedAt ?? 'nieznana'}\n`);
            if (!status.success) console.log(`::warning::${name}: refresh failed; publishing the validated fallback with failure status.`);
          }
          NODE

      - name: Verify source and the snapshot being published
        run: |
          node --check dist/app.js
          node --check dist/market.js
          node --check dist/item-detail.js
          node --check dist/chart-data.js
          node --check dist/profit.js
          node --check scripts/sync-market.mjs
          node --check scripts/sync-history.mjs
          npm test
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { normalizeSnapshot } from './dist/market.js';
          import { validateHistory } from './scripts/sync-history.mjs';
          const data = normalizeSnapshot(JSON.parse(readFileSync('dist/data/market-stalls.json', 'utf8')));
          if (!data.stats.items || !data.stats.stalls || !data.stats.offers) throw new Error('No usable fallback snapshot.');
          console.log(`Validated ${data.stats.stalls} shop records and ${data.stats.offers} offers.`);
          const history = validateHistory(JSON.parse(readFileSync('dist/data/price-history.json', 'utf8')));
          console.log(`Validated price history for ${Object.keys(history.items).length} items.`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
