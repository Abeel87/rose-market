name: Publish ROSE Market

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 8,20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read project source
        uses: actions/checkout@v7

      - name: Verify code before contacting data sources
        run: |
          npm run check
          npm test

      - name: Restore the last published data before refreshing
        run: node scripts/published-data.mjs

      - name: Record the start of this refresh
        run: node --input-type=module -e 'import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `REFRESH_STARTED_AT=${new Date().toISOString()}\n`);'

      - name: Refresh the market snapshot
        id: sync
        continue-on-error: true
        run: node scripts/sync-market.mjs

      - name: Refresh the separate buy and sell price history
        id: history
        continue-on-error: true
        run: node scripts/sync-history.mjs

      - name: Report refresh status
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: node scripts/report-sync.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Deploy the validated fallback and its honest error status first. Still mark
      # the run failed if a source refresh failed; a deployment is not a data check.
      - name: Require successful data synchronization
        if: steps.sync.outcome != 'success' || steps.history.outcome != 'success'
        run: |
          echo '::error::The fallback was published, but a data refresh failed. See the refresh summary.'
          exit 1
