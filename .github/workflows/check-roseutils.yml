name: Check ROSE Utils access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read reviewed project source
        uses: actions/checkout@v7
      - name: Verify the diagnostic client
        run: |
          npm run check
          npm test
      - name: Check the project's own ROSE Utils access
        env:
          ROSEUTILS_API_TOKEN: ${{ secrets.ROSEUTILS_API_TOKEN }}
        run: npm run check:roseutils
